name: Looply analysis validation
on:
  push:
    branches: [feature/ai-insights]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt httpx
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend JavaScript syntax
        run: |
          node --check ai_context.js
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          for i,script in enumerate(scripts):
              if script.strip():
                  Path(f'/tmp/looply-inline-{i}.js').write_text(script,encoding='utf-8')
          PY
          for file in /tmp/looply-inline-*.js; do [ -f "$file" ] && node --check "$file"; done
